<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#55555A"/></marker>
    <style>
      .b{fill:#FFFFFF;stroke:#0E0E10;stroke-width:1.6}
      .t{font-size:17px;font-weight:600;fill:#0E0E10;text-anchor:middle}
      .s{font-size:13px;fill:#55555A;text-anchor:middle}
      .l{stroke:#55555A;stroke-width:1.8;fill:none;marker-end:url(#a)}
      .d{stroke:#8A8A90;stroke-width:1.4;stroke-dasharray:5 5;fill:none;marker-end:url(#a)}
      .h{font-size:14px;font-weight:600;fill:#8A6A1F}
      .e{font-size:13px;fill:#55555A}
    </style>
  </defs>
  <rect width="1400" height="800" fill="#F8F6EF"/>
  <text x="40" y="44" font-size="26" font-weight="600" fill="#0E0E10">How Avuno is built</text>
  <text x="40" y="70" font-size="14" fill="#55555A">One message in, a contract and paid invoice out. Code decides at every step. An LLM is optional and never sets a price or a verdict.</text>

  <text class="h" x="40" y="108">TAKE THE REQUEST, CHECK IT, CHOOSE</text>
  <rect class="b" x="40" y="122" width="220" height="92" rx="10" style="fill:#F3E7C9"/><text class="t" x="150" y="160">Brand's request</text><text class="s" x="150" y="184">email, chat message or PDF</text>
  <rect class="b" x="310" y="122" width="220" height="92" rx="10"/><text class="t" x="420" y="160">Read</text><text class="s" x="420" y="184">rules only, details linked to lines</text>
  <rect class="b" x="580" y="122" width="220" height="92" rx="10"/><text class="t" x="690" y="160">Check company and sender</text><text class="s" x="690" y="184">source and date on each fact</text>
  <rect class="b" x="850" y="122" width="220" height="92" rx="10"/><text class="t" x="960" y="160">Rank creators</text><text class="s" x="960" y="184">evidence, published tiebreaks</text>
  <rect class="b" x="1120" y="122" width="240" height="92" rx="10"/><text class="t" x="1240" y="160">Set terms and price</text><text class="s" x="1240" y="184">private limits, one published rule</text>
  <path class="l" d="M260 168H308"/><path class="l" d="M530 168H578"/><path class="l" d="M800 168H848"/><path class="l" d="M1070 168H1118"/>

  <text class="h" x="40" y="298">FINISH THE JOB</text>
  <rect class="b" x="1120" y="312" width="240" height="92" rx="10"/><text class="t" x="1240" y="350">Contract</text><text class="s" x="1240" y="374">SHA-256 fingerprint</text>
  <rect class="b" x="850" y="312" width="220" height="92" rx="10"/><text class="t" x="960" y="350">Live re-check</text><text class="s" x="960" y="374">before anyone signs</text>
  <rect class="b" x="580" y="312" width="220" height="92" rx="10"/><text class="t" x="690" y="350">Sign, hold funds</text><text class="s" x="690" y="374">delivery, then approval</text>
  <rect class="b" x="310" y="312" width="220" height="92" rx="10"/><text class="t" x="420" y="350">Payout and invoice</text><text class="s" x="420" y="374">each exactly once</text>
  <rect class="b" x="40" y="312" width="220" height="92" rx="10" style="fill:#DDE9DF"/><text class="t" x="150" y="350">Finished work</text><text class="s" x="150" y="374">contract, invoice, full record</text>
  <path class="l" d="M1240 214V310"/><path class="l" d="M1120 358H1072"/><path class="l" d="M850 358H802"/><path class="l" d="M580 358H532"/><path class="l" d="M310 358H262"/>

  <rect class="b" x="40" y="470" width="400" height="78" rx="10" style="fill:#F3E7C9"/><text class="t" x="240" y="502">Asks a person only when it changes the result</text><text class="s" x="240" y="526">company, budget or niche missing; a fact changed; a source failed</text>
  <rect class="b" x="480" y="470" width="400" height="78" rx="10" style="fill:#F4DDD9"/><text class="t" x="680" y="502">Stops, and nothing is started</text><text class="s" x="680" y="526">impersonation, a hidden ad, or a duplicate of a running job</text>
  <path class="d" d="M420 214C420 300 300 420 260 468"/><path class="d" d="M960 404C900 450 480 440 420 468"/><path class="d" d="M690 214C760 300 760 420 700 468"/>

  <rect class="b" x="40" y="600" width="400" height="160" rx="10" style="fill:#EDEBF5"/><text class="t" x="240" y="634">Crustdata (live, cached, rate-limited)</text>
  <text class="s" x="240" y="662">Company Identify and Enrich: who is this company</text><text class="s" x="240" y="686">Person Search and Enrich: sender and contact checks</text><text class="s" x="240" y="710">Company and Job Search: finding brands</text><text class="s" x="240" y="734">Web Fetch and Search: creator pages, niche evidence</text>
  <rect class="b" x="480" y="600" width="400" height="160" rx="10"/><text class="t" x="680" y="634">State: SQLite, saved after every step</text>
  <text class="s" x="680" y="662">Ledger with stable keys: each email or payment happens once</text><text class="s" x="680" y="686">Append-only event log: what happened and why</text><text class="s" x="680" y="710">After a crash, each stage resumes where it stopped</text><text class="s" x="680" y="734">and skips anything already in the ledger</text>
  <rect class="b" x="920" y="600" width="440" height="160" rx="10" style="fill:#EFEFEF;stroke-dasharray:6 5"/><text class="t" x="1140" y="634">Simulated and labelled</text>
  <text class="s" x="1140" y="662">Mock outbox: nothing reaches anyone real</text><text class="s" x="1140" y="686">Signatures, escrow and payments</text><text class="s" x="1140" y="710">The other side's replies, delivery and approval</text><text class="s" x="1140" y="734">Demo creators are labelled mock accounts</text>
  <path class="d" d="M440 620C560 570 620 300 660 216"/><path class="d" d="M440 640C640 560 880 460 950 406"/><path class="d" d="M880 680H918"/>
</svg>
