<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Agent</title>
<style>
/* Placeholder styling. Replace these tokens when the design system arrives. */
:root { --bg:#fff; --fg:#111; --muted:#666; --line:#ddd; --accent:#222; --warn:#a15c00; --bad:#a11; --good:#176; --gap:12px; --font:system-ui,sans-serif; }
body { font:15px/1.5 var(--font); color:var(--fg); background:var(--bg); max-width:1100px; margin:0 auto; padding:var(--gap); }
nav button { margin-right:6px; } nav button.on { background:var(--accent); color:#fff; }
section { display:none; } section.on { display:block; }
form,.card { border:1px solid var(--line); padding:var(--gap); margin:var(--gap) 0; }
label { display:block; margin:6px 0; } input,select,textarea { font:inherit; padding:4px; width:100%; max-width:380px; box-sizing:border-box; }
button { font:inherit; padding:6px 10px; cursor:pointer; }
pre { white-space:pre-wrap; background:#f6f6f6; padding:8px; max-height:340px; overflow:auto; font-size:13px; }
.muted { color:var(--muted); font-size:13px; } .mock { color:var(--warn); font-size:12px; border:1px solid var(--warn); padding:0 4px; }
.steps span { display:inline-block; padding:2px 6px; margin:2px; border:1px solid var(--line); font-size:13px; } .steps .done { background:#e9f5ee; } .steps .now { background:var(--accent); color:#fff; }
.verified { color:var(--good); } .weak_match,.partly_verified,.contact_left { color:var(--warn); } .blocked,.cannot_verify { color:var(--bad); }
</style>
</head>
<body>
<h1>Deal Agent</h1>
<p class="muted">Minimal interface, pending the design system. Outbox, payments, signatures and simulated companies are mocks. <a href="/docs">API docs</a></p>
<nav><button data-tab="creator" class="on">Creator</button><button data-tab="company">Company</button><button data-tab="room">Deal room</button></nav>

<section id="creator" class="on">
  <form id="fCreator">
    <h3>Register</h3>
    <label>Instagram handle <input name="handle" required placeholder="@yourhandle"></label>
    <label>Niche <select name="niche"><option>food</option><option>beauty</option><option>fashion</option><option>tech</option><option>fitness</option><option>finance</option><option>travel</option></select></label>
    <label>Lowest price per reel (INR, private) <input name="floor_reel" type="number" min="0"></label>
    <label>Audience in India, % (self-reported) <input name="audience_country_pct" type="number" min="0" max="100"></label>
    <button>Read my public stats</button>
  </form>
  <div id="oCreator"></div>
  <button id="bMatches" hidden>Find likely brands</button>
  <div id="oMatches"></div><div id="oPacks"></div>
</section>

<section id="company">
  <form id="fCompany">
    <h3>Register</h3>
    <label>Company name <input name="name" required></label>
    <label>Niche <input name="niche" placeholder="food"></label>
    <label>Website or domain <input name="domain"></label>
    <label>Your name <input name="sender_name"></label>
    <label>Work email <input name="sender_email"></label>
    <label>Instagram page (if no website) <input name="instagram"></label>
    <label>GSTIN (if no website; lookup is mocked) <input name="gstin"></label>
    <label>Budget (INR, private) <input name="budget" type="number" min="0"></label>
    <button>Verify</button>
  </form>
  <div id="oCompany"></div>
  <label>Or paste a messy brief <textarea id="brief" rows="3"></textarea></label><button id="bBrief">Read brief</button>
  <pre id="oBrief" hidden></pre>
  <div id="oCreators"></div>
</section>

<section id="room">
  <button id="bList">Refresh deals</button>
  <div id="oDeals"></div>
  <div id="oDeal"></div>
  <h3>Mock outbox and action ledger</h3><pre id="oLedger"></pre>
</section>

<script>
const $ = s => document.querySelector(s);
const api = async (path, body) => { const r = await fetch(path, body ? {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(body)} : {}); return r.json(); };
const esc = v => String(v ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean = o => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== ''));
const form = f => clean(Object.fromEntries(new FormData(f)));
const facts = fs => (fs||[]).map(f => `<li><b>${esc(f.field)}</b>: ${esc(f.value)} <span class="muted">${esc(f.source)} · ${esc((f.as_of||'').slice(0,10))} · ${esc(f.strength)}</span>${f.is_mock?' <span class="mock">mock</span>':''}</li>`).join('');
document.querySelectorAll('nav button').forEach(b => b.onclick = () => { document.querySelectorAll('nav button,section').forEach(x => x.classList.remove('on')); b.classList.add('on'); $('#'+b.dataset.tab).classList.add('on'); });
let creator, company;

$('#fCreator').onsubmit = async e => { e.preventDefault(); $('#oCreator').textContent = 'Reading public pages, up to a minute...';
  const f = form(e.target); const body = {handle:f.handle, niche:f.niche, limits:{floor_reel:f.floor_reel?+f.floor_reel:null}, audience_country_pct:f.audience_country_pct?+f.audience_country_pct:null};
  creator = await api('/api/creators', body); const s = creator.stats||{};
  $('#oCreator').innerHTML = `<div class="card"><b>@${esc(creator.handle)}</b> <span class="${creator.status==='read'?'verified':'cannot_verify'}">${creator.status==='read'?'read':'cannot verify'}</span><br>Followers ${esc(s.followers)} · engagement ${s.engagement_rate!=null?(s.engagement_rate*100).toFixed(1)+'%':'unknown'}<ul>${facts(creator.facts)}</ul><span class="muted">Prove ownership: add <b>${esc(creator.ownership_code)}</b> to your bio.</span></div>`;
  $('#bMatches').hidden = false; };

$('#bMatches').onclick = async () => { $('#oMatches').textContent = 'Scoring brands...'; const m = await api(`/api/creators/${creator.id}/matches`);
  $('#oMatches').innerHTML = `<h3>Likely brands</h3><p class="muted">${esc(m.note)}</p>` + m.matches.map(b => `<div class="card"><b>${esc(b.name)}</b> <span class="${esc(b.status)}">${esc(b.status)}</span> · likelihood ${b.likelihood} · confidence ${b.confidence}<br><span class="muted">${esc(b.reasons.join(' '))}${b.decided_by?' Ranked above next: '+esc(b.decided_by):''}</span><br><button data-pack="${esc(b.company_id)}">Media packs</button></div>`).join('') + `<details><summary>${m.rejected.length} rejected, with reasons</summary>${m.rejected.map(b => `<div class="muted">${esc(b.name)}: ${esc(b.reasons.join(' '))}</div>`).join('')}</details>`;
  document.querySelectorAll('[data-pack]').forEach(b => b.onclick = () => showPacks(b.dataset.pack)); };

async function showPacks(id) { const p = await api(`/api/creators/${creator.id}/packs/${id}`);
  $('#oPacks').innerHTML = '<h3>Media packs <span class="mock">estimates</span></h3>' + p.packs.map((x,i) => `<div class="card"><b>${x.name}</b> ${x.terms.reels} reel, ${x.terms.stories} stories, ${x.terms.usage_days} days usage, ${x.terms.exclusivity_days} days exclusive<br>List INR ${x.evaluation.list_price} · you net ${x.evaluation.creator_net_estimate} · close estimate ${x.evaluation.close_estimate}%<br>
  <label>Tweak usage days <input type="number" id="t${i}" value="${x.terms.usage_days}"></label><button data-t="${i}">Check tweak</button> <button data-d="${i}">Start deal</button><div id="r${i}" class="muted"></div></div>`).join('');
  p.packs.forEach((x,i) => { document.querySelector(`[data-t="${i}"]`).onclick = async () => { const r = await api(`/api/creators/${creator.id}/packs/${id}/tweak`, {before:x.terms, after:{...x.terms, usage_days:+$('#t'+i).value}}); $('#r'+i).textContent = `${r.verdict}: price ${r.delta.list_price>=0?'+':''}${r.delta.list_price}, close ${r.delta.close_estimate>=0?'+':''}${r.delta.close_estimate}, expected earnings ${r.delta.expected_earnings>=0?'+':''}${r.delta.expected_earnings}. ${r.problem||''} ${r.note}`; };
    document.querySelector(`[data-d="${i}"]`).onclick = () => startDeal([creator.id], id, x.terms); }); }

$('#fCompany').onsubmit = async e => { e.preventDefault(); $('#oCompany').textContent = 'Verifying...'; const f = form(e.target); if (f.budget) f.budget = +f.budget; company = await api('/api/companies', f);
  $('#oCompany').innerHTML = `<div class="card"><b>${esc(company.name)}</b> <span class="${esc(company.status)}">${esc(company.status)}</span> · sender <span class="${esc(company.sender_status)}">${esc(company.sender_status)}</span> · tier ${esc(company.tier)}<br><span class="muted">${esc((company.reasons||[]).join(' '))}</span><ul>${facts(company.facts)}</ul></div>`;
  if (company.status !== 'blocked') { const c = await api(`/api/companies/${company.id}/creators`);
    $('#oCreators').innerHTML = `<h3>Creators</h3>` + c.creators.map(r => `<div class="card"><b>@${esc(r.handle)}</b> fit ${r.fit} · confidence ${r.confidence} · est. INR ${r.list_price_estimate}${r.is_mock?' <span class="mock">mock</span>':''}<br><span class="muted">${esc(r.reasons.join(' '))}${r.decided_by?' Ranked above next: '+esc(r.decided_by):''}</span></div>`).join('') + (c.suggested_bundle.length?`<button id="bBundle">Start deal with suggested bundle of ${c.suggested_bundle.length}</button>`:'<p class="muted">No creators in this niche yet.</p>');
    if (c.suggested_bundle.length) $('#bBundle').onclick = () => startDeal(c.suggested_bundle, company.id, {reels:1, stories:0, usage_days:30}); } };

$('#bBrief').onclick = async () => { const b = await api('/api/briefs', {text:$('#brief').value}); $('#oBrief').hidden = false; $('#oBrief').textContent = JSON.stringify(b, null, 2); };

async function startDeal(creators, companyId, terms) { const d = await api('/api/deals', {creator_ids:creators, company_id:companyId, terms}); document.querySelector('[data-tab=room]').click(); watch(d.id); }

const ORDER = ['verify','pitch','await_company','negotiate','contract','recheck','sign','fund','deliver','approve','release','invoice','done'];
let es;
async function render(id) { const d = await api(`/api/deals/${id}`); const at = ORDER.indexOf(d.state);
  const s = d.settlement;
  $('#oDeal').innerHTML = `<div class="card"><b>${esc(d.id)}</b> · ${esc(d.state)}<div class="steps">${ORDER.map((x,i) => `<span class="${i<at?'done':i===at?'now':''}">${x}</span>`).join('')}</div>
  ${d.final_reason?`<p class="blocked">${esc(d.final_reason)}</p>`:''}
  ${d.paused&&d.paused.question?`<p class="contact_left">${esc(d.paused.question)}</p><button id="yes">Yes</button> <button id="no">No</button>`:''}
  ${s?`<p>Agreed INR ${s.price}. Brand pays ${s.brand_pays}. <span class="muted">${esc(s.rule)}</span></p>`:''}
  ${d.recheck?`<p class="muted">Pre-signing re-check: ${esc(d.recheck.detail)}</p>`:''}
  ${d.contract_hash?`<details><summary>Contract · SHA-256 ${esc(d.contract_hash.slice(0,16))}...</summary><pre>${esc(d.contract_text)}</pre></details>`:''}
  ${d.state==='done'?'<p class="verified">Finished: paid and invoiced (mock).</p>':''}</div>`;
  if (d.paused&&d.paused.question) { $('#yes').onclick = () => decide(id,true); $('#no').onclick = () => decide(id,false); }
  $('#oLedger').textContent = d.actions.map(a => `${a.ts.slice(11,19)} ${a.kind} ${JSON.stringify(a.payload).slice(0,150)}`).join('\n'); }
async function decide(id, approve) { await api(`/api/deals/${id}/decide`, {approve}); render(id); }
function watch(id) { if (es) es.close(); es = new EventSource(`/api/deals/${id}/events`); es.onmessage = () => render(id); render(id); }
$('#bList').onclick = async () => { const ds = await api('/api/deals'); $('#oDeals').innerHTML = ds.map(d => `<button data-w="${esc(d.id)}">${esc(d.id)} · ${esc(d.state)}</button>`).join(' '); document.querySelectorAll('[data-w]').forEach(b => b.onclick = () => watch(b.dataset.w)); };
</script>
</body>
</html>
